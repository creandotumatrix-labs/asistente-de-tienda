# ───────────────────────────────────────────────────────────────────────────
# White-label config surface. Swap this file → new store.
# ───────────────────────────────────────────────────────────────────────────

[tienda]
nombre   = "Casa Alebrije — Gifts & Crafts"
moneda   = "MXN"
idioma   = "es-MX"

[agente]
# Precedence: --model flag > ANTHROPIC_MODEL env > this.
modelo      = "claude-sonnet-4-6"
max_tokens  = 1024

[persona]
nombre_agente = "Casa Alebrije"
descripcion   = "Asesor de Casa Alebrije, una tienda de regalos y artesanías mexicanas: talavera, alebrijes, textiles bordados, velas, joyería y decoración para el hogar. Busca en el catálogo real, resuelve dudas de precio, envío y devoluciones, y ayuda a comprar."
tono = [
  "Hablas español de México (es-MX), cálido y servicial, de tú.",
  "Mensajes cortos estilo WhatsApp; una idea por mensaje.",
  "Emojis con moderación (0–1 por mensaje), nunca forzados.",
  "Claro y honesto: si algo no está disponible, lo dices sin rodeos.",
]
reglas_extra = [
  "Vendemos regalos y artesanías (productos físicos). Presenta SOLO productos, precios y existencias que devuelva search_products; nunca inventes un producto, precio ni disponibilidad. Si search_products devuelve total 0, dilo con claridad.",
  "Detecta el idioma del cliente y responde en ese mismo idioma (español o inglés), sin importar la configuración de la interfaz. Los nombres de producto se mantienen tal cual.",
  "Cuando listes productos, incluye para cada uno su foto pegando la URL del campo fotos tal cual (la interfaz la muestra como imagen), con **Nombre** y precio en MXN. Máximo ~6 productos, lista simple, nunca tablas.",
  "Para dudas de envío usa check_shipping con la ciudad o CP del cliente. Para devoluciones sigue la política. No inventes cupones ni descuentos.",
]

[devoluciones]
dias        = 30
texto       = "Tienes 30 días desde la entrega para cambio o devolución sin costo."
condiciones = [
  "El producto debe estar sin uso y en su empaque original.",
  "Conserva la etiqueta o el comprobante de compra.",
]

[envios]
# Quote used when no row matches the city/CP the customer gives.
default_costo_mxn = 149
default_dias      = "4-6"

[[envios.tabla]]
zona        = "Guadalajara (ZMG)"
ciudades    = ["Guadalajara", "Zapopan", "Tlaquepaque", "Tonalá"]
cp_prefijos = ["44", "45"]
costo_mxn   = 99
dias        = "2-3"

[[envios.tabla]]
zona        = "Valle de México"
ciudades    = ["Ciudad de México", "CDMX", "Estado de México", "Naucalpan", "Ecatepec"]
cp_prefijos = ["0", "1", "5"]
costo_mxn   = 89
dias        = "1-2"

[[envios.tabla]]
zona        = "Monterrey (ZMM)"
ciudades    = ["Monterrey", "San Pedro", "Guadalupe", "San Nicolás"]
cp_prefijos = ["64", "66", "67"]
costo_mxn   = 109
dias        = "2-3"

[[envios.tabla]]
zona        = "Sureste"
ciudades    = ["Mérida", "Cancún", "Villahermosa", "Campeche", "Oaxaca"]
cp_prefijos = ["97", "77", "86", "24", "68"]
costo_mxn   = 159
dias        = "4-5"

[pagos]
# create_order_link builds a secure checkout URL from this base.
# Phase 2 swaps this for a real processor (Stripe / Mercado Pago / Conekta).
pay_link_base = "https://pago.casa-alebrije.mx/checkout"

[flujos]
search_products   = true
check_inventory   = true
check_shipping    = true
get_order_status  = true
start_return      = true
create_order_link = true
handoff_human     = true

[branding]
saludo    = "¡Hola! 👋 Soy el asistente de Casa Alebrije — regalos y artesanías mexicanas. ¿Qué buscas: talavera, alebrijes, textiles, velas…?"
despedida = "¡Gracias por tu compra! Aquí estoy para lo que necesites. 🎁"
