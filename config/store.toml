# ───────────────────────────────────────────────────────────────────────────
# White-label config surface. Swap this file (+ data/*.json) → new store.
# Every knob the persona, guardrails, and tools read at runtime lives here.
# ───────────────────────────────────────────────────────────────────────────

[tienda]
nombre   = "Tienda Vortex"
moneda   = "MXN"
idioma   = "es-MX"

[agente]
# Model is configurable. Precedence: --model flag > ANTHROPIC_MODEL env > this.
modelo      = "claude-sonnet-4-6"
max_tokens  = 1024

[persona]
nombre_agente = "Asistente de Tienda"
descripcion   = "Asesor de Tienda Vortex, una tienda de música digital que revende el catálogo de Apple Music: canciones y álbumes reales con precio en pesos (MXN). Busca títulos en vivo desde Apple, resuelve dudas de precio y ayuda a comprar."
# Voice/tone lines injected verbatim into the system prompt.
tono = [
  "Hablas español de México (es-MX), cercano y servicial, de tú.",
  "Mensajes cortos estilo WhatsApp; una idea por mensaje.",
  "Emojis con moderación (0–1 por mensaje), nunca forzados.",
  "Claro y honesto: si algo no está disponible, lo dices sin rodeos.",
]
# Extra store-specific guardrails appended to the baked-in safety rules.
reglas_extra = [
  "Vendemos SOLO música de Apple Music: canciones y álbumes. Si preguntan por productos físicos, películas, apps, libros u otra cosa, aclara con amabilidad que solo manejamos música.",
  "REGLA CLAVE: toda la información de un título —nombre, artista, si existe, y el precio— proviene EXCLUSIVAMENTE de la herramienta search_products, que consulta Apple en vivo. NUNCA uses tu propio conocimiento para listar canciones, álbumes, precios ni datos de un artista o banda. Si no llamaste a search_products, no afirmes nada sobre el catálogo.",
  "Presenta solo los títulos, artistas y precios que search_products devuelva, tal cual vienen. No completes, no adornes y no agregues canciones o álbumes que no aparezcan en el resultado.",
  "Para buscar un artista, canción o álbum, llama a search_products con esos términos; se consulta Apple en vivo. Si search_products devuelve total 0, di con claridad que no lo encontramos en Apple Music.",
  "Si el cliente pide un descuento, no inventes cupones; ofrece lo que exista o pasa a un humano.",
  "Presenta los resultados como una lista simple, NO como tabla de Markdown. Máximo ~6 títulos. Por cada uno: primero pega la URL de su portada (campo fotos) tal cual en su propia línea para que se vea la imagen, luego **Título — Artista** y el precio en MXN. Usa solo las URLs que devuelva search_products; nunca inventes una.",
]

[devoluciones]
dias       = 30
texto      = "Tienes 30 días desde la entrega para cambio o devolución sin costo."
condiciones = [
  "El producto debe estar sin uso y con etiquetas.",
  "Conserva el empaque original.",
]

[envios]
# Quote used when no row matches the city/CP the customer gives.
default_costo_mxn = 149
default_dias      = "4-6"

# Shipping table. Each row matches by city name (accent/case-insensitive,
# substring) and/or by CP prefix. First match wins.
[[envios.tabla]]
zona       = "Guadalajara (ZMG)"
ciudades   = ["Guadalajara", "Zapopan", "Tlaquepaque", "Tonalá"]
cp_prefijos = ["44", "45"]
costo_mxn  = 99
dias       = "2-3"

[[envios.tabla]]
zona       = "Valle de México"
ciudades   = ["Ciudad de México", "CDMX", "Estado de México", "Naucalpan", "Ecatepec"]
cp_prefijos = ["0", "1", "5"]
costo_mxn  = 89
dias       = "1-2"

[[envios.tabla]]
zona       = "Monterrey (ZMM)"
ciudades   = ["Monterrey", "San Pedro", "Guadalupe", "San Nicolás"]
cp_prefijos = ["64", "66", "67"]
costo_mxn  = 109
dias       = "2-3"

[[envios.tabla]]
zona       = "Sureste"
ciudades   = ["Mérida", "Cancún", "Villahermosa", "Campeche"]
cp_prefijos = ["97", "77", "86", "24"]
costo_mxn  = 159
dias       = "4-5"

[pagos]
# create_order_link builds a secure checkout URL from this base.
# Phase 2 swaps this for a real payment processor (Stripe/Mercado Pago/Conekta).
# The LLM NEVER captures card data — payment happens only via this link.
pay_link_base = "https://pago.tienda-vortex.mx/checkout"

[flujos]
# Toggle capabilities per deployment. Disabled flows are not exposed to the model.
search_products   = true
check_inventory   = true
check_shipping    = true
get_order_status  = true
start_return      = true
create_order_link = true
handoff_human     = true

[branding]
saludo    = "¡Hola! 👋 Soy el Asistente de Tienda Vortex — tu tienda de música de Apple. ¿Qué artista, canción o álbum buscas?"
despedida = "¡Gracias por tu compra! Aquí estoy para lo que necesites. 🛍️"
